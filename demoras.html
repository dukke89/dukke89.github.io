<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ABASTECIMIENTO - Demoras</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="demoras.css" />

  <!-- Chart mensual -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Apache ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>

<body class="page-demoras">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-title">ABASTECIMIENTO</div>
        <div class="brand-sub">DEMORAS</div>
      </div>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a class="active" href="demoras.html">Demoras</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- FILTROS -->
    <section class="panel">
      <div class="panel-title">Filtros</div>
      <div class="panel-body">
        <div class="filters filters-demoras">
          <div class="filter">
            <label>ALMACÉN / CLIENTE</label>
            <select id="clienteSelect">
              <option>Todos</option>
            </select>
            <div id="clienteHint" class="hint">Columna cliente: -</div>
          </div>

          <div class="filter">
            <label>MES</label>
            <select id="mesSelect"></select>
            <div id="mesHint" class="hint">Mes seleccionado: -</div>
          </div>
        </div>
      </div>
    </section>

    <!-- KPI (si ya lo usabas) -->
    <section class="panel">
      <div class="panel-title">Items cumplidos FT - Desglose por área</div>
      <div class="panel-body kpi-grid kpi-grid-3">
        <div class="kpi kpi-blue">
          <div class="kpi-head">
            <div class="kpi-title">DEMORAS (MES)</div>
            <div class="kpi-icon">⏱</div>
          </div>
          <div id="kpiDemorasMes" class="kpi-value">-</div>
          <div class="kpi-sub">Cantidad de pedidos con demora</div>
        </div>
      </div>
    </section>

    <!-- BLOQUE 1: separado -->
    <section class="panel">
      <div class="panel-title">GRÁFICOS</div>
      <div class="panel-body">
        <div class="chart-box chart-box--tall">
          <canvas id="chartMes"></canvas>
        </div>
      </div>
    </section>

    <!-- BLOQUE 2: juntos (dona + tabla) -->
    <section class="panel">
      <div class="panel-title">DEMORAS X AREA SEGUN MES SELECCIONADO</div>
      <div class="panel-body">
        <div class="chart-row">
          <div id="chartAreas" class="chart-box"></div>

          <div class="table-wrap">
            <table id="tableAreas" aria-label="Tabla demoras por mes y área">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="note">Fuente: DEMORAS.csv</div>
      </div>
    </section>

    <!-- BLOQUE 3: juntos (dona + tabla) -->
    <section class="panel">
      <div class="panel-title">DEMORAS PROYECTO</div>
      <div class="panel-body">
        <div class="chart-row">
          <div id="chartMotivos" class="chart-box"></div>

          <div class="table-wrap">
            <table id="tableMotivos" aria-label="Tabla demoras proyecto">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="note">Fuente: DEMORAS.csv</div>
      </div>
    </section>

  </main>

  <script src="demoras.js"></script>
</body>
</html>
