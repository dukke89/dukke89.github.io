<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ABASTECIMIENTO</title>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="analisis-mm.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>

<body class="page-mm">
  <header class="topbar">
    <div class="topbar-left">
      <div class="title">ABASTECIMIENTO</div>
      <div class="subtitle">Análisis MM</div>
    </div>
    <div class="topbar-right">
      <div class="update-box">
        <div class="update-label">Última actualización</div>
        <div id="lastUpdate" class="update-date">--/--/----</div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <a class="tab active" href="analisis-mm.html">ANÁLISIS MM</a>
    <a class="tab" href="index.html">CUMPLIMIENTO</a>
    <a class="tab" href="demoras.html">DEMORAS</a>
  </nav>

  <main class="container">
    <div id="msg"></div>

    <section class="panel">
      <div class="panel-body mm-filter-row">
        <div class="filter">
          <label>CLIENTE (ALMACEN)</label>
          <select id="clienteSelect">
            <option value="">Todos</option>
          </select>
          <div id="clienteHint" class="hint">Columna cliente: -</div>
        </div>
        <div class="filter">
          <label>&nbsp;</label>
          <button id="btnReset" class="btn">Reset</button>
          <div class="hint">Vuelve a “Todos”</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">ESTADOS</div>
      <div class="panel-body">
        <div class="mm-card">
          <div class="mm-card-title">GRÁFICO CIRCULAR</div>
          <div class="mm-split">
            <div class="chart-box">
              <div id="donutEstados" style="height:420px;"></div>
            </div>
            <div class="mm-table-wrap">
              <table class="mm-table">
                <thead>
                  <tr>
                    <th>Estado</th>
                    <th class="num">Materiales</th>
                    <th class="num">%</th>
                  </tr>
                </thead>
                <tbody id="tablaValorizacion"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footnote">
      Fuente: <b>ANALISIS-MM.csv</b>
    </footer>
  </main>

  <script src="analisis-mm.js"></script>
</body>
</html>
