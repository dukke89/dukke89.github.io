<!doctype html>

<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">
  <link rel="stylesheet" href="base.css" />
  <style>
    /* Estilos para la tabla pivot */
    .pt-container {
      width: 100%;
      overflow-x: auto;
      background: #fff;
      padding: 10px;
    }
    .pivot-table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      min-width: 900px;
    }
    .pivot-table th {
      background: #bce6f4;
      text-align: left;
      padding: 8px 6px;
      font-weight: bold;
      border-right: 1px solid #fff;
      border-bottom: 2px solid #99d6ea;
    }
    .pivot-table td {
      padding: 4px 6px;
      vertical-align: top;
      border-right: 1px solid #eee;
    }
    .pt-group-row {
      background: #fdfdfd;
      font-weight: bold;
      cursor: pointer;
      border-top: 1px solid #ccc;
    }
    .pt-group-row:hover {
      background: #f1f8ff;
    }
    .pt-group-total {
      font-weight: bold;
      background: #ffff00;
      border-bottom: 1px solid #ccc;
    }
    .pt-grand-total {
      font-weight: bold;
      background: #bce6f4;
      border-top: 2px solid #99d6ea;
    }
    .pt-detail-row {
      background: #fff;
    }
    .pt-detail-row.hide {
      display: none;
    }
    .pt-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      height: 12px;
      text-align: center;
      color: #333;
      border: 1px solid #999;
      background: #fff;
      margin-right: 5px;
      font-size: 10px;
      cursor: pointer;
    }
    .num {
      text-align: right;
    }
    /* Header table global */
    .pt-top-header {
      background: #bce6f4;
      font-weight: bold;
      padding: 8px;
    }
  </style>
</head>

          <select id="destinatarioSelect" multiple size="6" class="multi-select">
            <option value="">Todos</option>
          </select>
          <div class="hint">Columna: Nombre destinatario de mercancías</div>
        </div>
      </div>

    <!-- TABLA PIVOT -->
